# Default environment for dbt Projects on Snowflake.
#
# Its only job is to give DBT_DEV_SCHEMA_SUFFIX a defined, empty value. The
# suffix — not the target — is what separates the three pre-production
# contexts from each other:
#
#   local dev      DBT_DEV_SCHEMA_SUFFIX=shall   -> BRONZE_SHALL
#   PR to dev      DBT_DEV_SCHEMA_SUFFIX=pr_12   -> BRONZE_PR_12
#   merge to dev   unset                         -> BRONZE
#   merge to main  unset                         -> BRONZE (in PROD_DB)
#
# Snowflake requires every key here to be UPPERCASE and DBT_-prefixed, which
# is also why --use-shell-env-vars can pass it through from a local shell:
# that flag only forwards DBT_-prefixed variables.
#
# Precedence, highest first: ENV_VARS on EXECUTE DBT PROJECT (--env-vars),
# then DBT_-prefixed shell variables (--use-shell-env-vars), then this file.

env_config:
  default_environment: default
  environments:
    - name: default
      env:
        DBT_DEV_SCHEMA_SUFFIX: ""
