name: Incoming PR
run-name: PR opened by ${{ github.actor }}
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  changes:
    name: "Detect changed paths"
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/**'

  terraform-plan:
    name: "Terraform Plan"
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    environment: prod # Must match the key-pair auth's associated environment
    env:
      SNOWFLAKE_ORGANIZATION_NAME: epgqqsk
      SNOWFLAKE_ACCOUNT_NAME: kn46620
      SNOWFLAKE_USER: GITHUB_ACTIONS_SERVICE_USER
      SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_RAW }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.16"

      - name: Debug private key shape (no content printed)
        run: |
          echo "byte length: $(printf '%s' "$SNOWFLAKE_PRIVATE_KEY" | wc -c)"
          echo "line count: $(printf '%s' "$SNOWFLAKE_PRIVATE_KEY" | wc -l)"
          echo "BEGIN markers: $(printf '%s' "$SNOWFLAKE_PRIVATE_KEY" | grep -c 'BEGIN')"
          echo "END markers: $(printf '%s' "$SNOWFLAKE_PRIVATE_KEY" | grep -c 'END')"

      - name: Terraform init
        working-directory: infra
        run: terraform init

      - name: Terraform plan
        working-directory: infra
        run: terraform plan -no-color

  run-snowflake-test-dbt-job:
    name: "Run on Incoming PR"
    runs-on: ubuntu-latest
    environment: prod # Must match the OIDC subject's environment
    env:
      SNOWFLAKE_CLI_FEATURES_ENABLE_DBT: true
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      # SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PAT }} # Snowflake password is required if you aren't using OIDC
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}

    steps:
      # Check out repository code
      # Gets the latest code from the incoming pull request
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-cli-action@v2.0
        with: # Ensures Snowflake CLI will search for OIDC users matching this subject
          use-oidc: true

      - name: Check Snowflake CLI Version
        run: snow --version

      # The -x is shorthand for --temporary-connection
      - run: snow connection test -x

      # The --force setting creates the object or updates it if it already exists
      # You can remove the "--source" flag if your dbt_project.yml is at root of your repo
      - name: Create a new tester dbt project object in ${{ vars.SNOWFLAKE_DATABASE }}.${{ vars.SNOWFLAKE_SCHEMA }}
        run: snow dbt deploy tester_budget_dbt_project_object_gh_action --source ./dbt --dbt-version 1.10.15 --force -x

      - name: List all of the snowflake dbt project objects in your account
        run: snow dbt list -x

      # Builds all models and runs tests in DAG order, failing early if any upstream test breaks
      - name: Build and test dbt project in ${{ vars.SNOWFLAKE_DATABASE }}.${{ vars.SNOWFLAKE_SCHEMA }}
        run: snow dbt execute -x tester_budget_dbt_project_object_gh_action build --target dev
